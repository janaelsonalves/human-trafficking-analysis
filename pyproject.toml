[project]
name = "eda-disque100-completo"
version = "0.1.0"
description = "Analysing Human Trafficking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "matplotlib>=3.9",
    "nbformat>=4.2.0",
    "notebook>=7.6.4",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.5",
    "seaborn>=0.13.2",
]

[tool.uv]
# usa a trust store do sistema em vez do bundled webpki-roots 
#system-certs = true
native-tls = true

[[tool.uv.index]]
name = "bcb"
url = "https://repo.bcnet.bcb.gov.br/api/pypi/pypi/simple"
default = true
